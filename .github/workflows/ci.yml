name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Exit code 5 means pytest found no tests to run, which is the state of
      # this repository until the first test module lands. Anything else fails.
      - name: Tests
        run: pytest || [ $? -eq 5 ]
